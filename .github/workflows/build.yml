# NODE-007 (step 7): every env in platformio.ini builds on every push, the host tests run, and the include
# direction (src/detection must not include src/modes) and the twin test lists are enforced. No hardware here: a green run means
# "compiles and host tests pass", never "works on a board" (CLAUDE.md).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  esp32:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env:
          - esp32dev
          - esp32dev-analyzer
          - esp32dev-emitter
          - esp32dev-piezo
          - esp32dev-piezo-analyzer
          - esp32dev-piezo-emitter
          - esp32dev-wraptest
          - esp32dev-analyzer-wraptest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      # The placeholder secrets header, so the real OTA code (WiFi join, token check) compiles, not the
      # no_credentials stub (review 12.0 M3). include/wifi_secrets.h is git-ignored; CI never has the real one.
      - run: cp include/wifi_secrets.example.h include/wifi_secrets.h
      - run: pio run -e ${{ matrix.env }}

  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: pio-host-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: g++ --version
      - run: pio run -e native-replay
      # Step 11e item 7 follow-up: the replay with the Analyzer's diagnostics compiled in must print exactly
      # what the Null build prints over the fixtures (the side channel does not change a verdict).
      - run: pio run -e native-replay-diag
      - name: replay output, Null vs ANALYZER_MODE diagnostics
        run: |
          .pio/build/native-replay/program --verbose --dir test/fixtures > replay-null.txt
          .pio/build/native-replay-diag/program --verbose --dir test/fixtures > replay-diag.txt
          diff replay-null.txt replay-diag.txt
          wc -l replay-null.txt
      - run: pio test -e native-test
      - run: pio test -e native-test-behavior
      - run: pio test -e native-test-diag
      # The bench tools' parsers (step 11g A: shapesurvey's shape_fields over a recorded replay).
      - run: python3 tools/bench/test_shapesurvey.py

  include-direction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Strict since ANA-003 (step 10) moved the Analyzer out of src/detection.
      - run: python3 tools/ci/include_direction.py --strict
      # platformio.ini's twin lists: ESP test_ignore vs the native envs' test_filter (review D4.3).
      - run: python3 tools/ci/test_lists.py

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Step 11j: .clang-format with the pinned clang-format (the version tools/ci/clang_format.py checks for);
      # fails on drift over src/, lib/ and test/ (fixtures and generated headers excluded).
      - run: pip install clang-format==18.1.8
      - run: python3 tools/ci/clang_format.py --check
