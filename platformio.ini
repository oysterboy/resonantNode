; PlatformIO Project Configuration File

[platformio]
default_envs = esp32dev-analyzer

[env:esp32dev]
; Pinned (NODE-014): the D-AMP HAL relies on the legacy I2S driver's RX/TX
; framing of this exact platform (Arduino-ESP32 2.0.17, IDF 4.4.7). Rerun
; the framing check (SELFTEST mic: raw bit 8 toggles) on any upgrade.
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; Flash at 80 MHz QIO, not the board default 40 MHz DIO. Most code runs from
; flash through the cache; at 40 MHz DIO the Analyzer's per-sample path cost
; ~79 us against a 62.5 us budget (16 kHz) and the I2S driver dropped ~30% of
; the audio. 80 MHz DIO: ~58 us, still dropping; 80 MHz QIO: ~51 us, none.
; Issue #26, bench session 2026-10-09-issue26-10cm.
board_build.f_flash = 80000000L
board_build.flash_mode = qio

extra_scripts = pre:scripts/git_version.py

; The host-only suites; each runs in a native-test* env's test_filter below
; (tools/ci/test_lists.py checks that the two lists agree).
test_ignore =
 test_replay_corpus
 test_behavior_rest
 test_behavior_level
 test_behavior_base
 test_behavior_refractory
 test_param_registry
 test_sound_output
 test_net_frame
 test_shape_inspector
 test_text_parse
 test_param_commands
 test_detection_diagnostics
 test_ring_queue
 test_report_printers
 test_node_baseline
 test_node_composer
 test_behavior_status
 test_analyzer_commands

; Analyzer tooling is not part of the Node or Emitter runtime: keep it out of
; those binaries at the build level, not merely unreachable inside them. See
; docs/refactors/archive/cleanup-analyzer-node-isolation.md. Since ANA-003 (step 10) the
; AnalyzerApp member files live in modes/analyzer/; detection/analyzer/ keeps the
; pure Analyzer types and rules, and no detection file includes them.
build_src_filter =
 +<*>
 -<detection/analyzer/>
 -<modes/analyzer/>
 -<host/>

build_flags =
 -D BUILD_VERSION=\"0.4.0\"
 -D ARDUINO_LOOP_STACK_SIZE=16384
 -D CHIRP_FREQUENCY_HZ=3200

[env:esp32dev-emitter]
extends = env:esp32dev

build_flags =
 ${env:esp32dev.build_flags}
 -D EMITTER_MODE

; The echo modes' shell (ECHO-003, step 20.1): the per-sample path at 48 kHz with the radio up, for the loop
; budget's go / no-go (roadmap-echo.md, condition 3). 8 DMA buffers of 128 frames hold 21 ms at 48 kHz (3 would
; hold 8 ms, the Node's queue at 16 kHz is 24 ms). D-AMP only: the piezo board has no TX on the mic's port.
[env:esp32dev-echo]
extends = env:esp32dev
build_src_filter =
 ${env:esp32dev.build_src_filter}
 -<modes/resonant/>
 -<modes/emitter/>
build_flags =
 ${env:esp32dev.build_flags}
 -D ECHO_MODE
 -D AUDIO_I2S_SAMPLE_RATE_HZ=48000
 -D I2S_DMA_BUF_COUNT=8

[env:esp32dev-analyzer]
extends = env:esp32dev

; The Analyzer build is the one target that does compile the analyzer tooling.
build_src_filter =
 +<*>
 -<host/>

build_flags =
 ${env:esp32dev.build_flags}
 -D ANALYZER_MODE

; Board: the plain envs above build the D-AMP node (src/app/BoardConfig.h).
; The piezo nodes are discontinued; these envs keep their build compiling as
; the fallback (docs/decisions/2026-10-09-discontinue-piezo.md).
[env:esp32dev-piezo]
extends = env:esp32dev

build_flags =
 ${env:esp32dev.build_flags}
 -D BOARD_PIEZO

[env:esp32dev-piezo-emitter]
extends = env:esp32dev

build_flags =
 ${env:esp32dev.build_flags}
 -D BOARD_PIEZO
 -D EMITTER_MODE

[env:esp32dev-piezo-analyzer]
extends = env:esp32dev-analyzer

build_flags =
 ${env:esp32dev.build_flags}
 -D BOARD_PIEZO
 -D ANALYZER_MODE

; Wrap test (issue #30, docs/refactors/archive/micros-wrap.md): the time base
; (src/app/TimeBase.h) starts at 2^32 us - 180 s, so the 32-bit us wrap that
; made detection go deaf 71.6 min after boot happens 3 min after boot. Same
; firmware otherwise: BUILD_VERSION and the BUILD banner are unchanged; a
; separate "TIMEBASE offset_us=..." line follows the banner. Debug only,
; never deploy. For the 32-bit ms wrap (49.7 days) use
; -D TIMEBASE_OFFSET_US=4294787296000ULL instead (ms wrap 3 min after boot).
[env:esp32dev-wraptest]
extends = env:esp32dev

build_flags =
 ${env:esp32dev.build_flags}
 -D TIMEBASE_OFFSET_US=4114967296ULL

[env:esp32dev-analyzer-wraptest]
extends = env:esp32dev-analyzer

build_flags =
 ${env:esp32dev-analyzer.build_flags}
 -D TIMEBASE_OFFSET_US=4114967296ULL

; Host replay (NODE-006): the real detection chain (PcmPreprocessor ->
; AudioSignal -> FreqBandStream -> DetectionRuntime) compiled for the PC and
; fed with RAW captures (bench/sessions/*-corpus-*, tools/bench/rawcorpus.py).
; Needs a host C++ compiler on PATH (g++ from WinLibs/MinGW, or clang). Build
; with `pio run -e native-replay`; the program is .pio/build/native-replay/
; program(.exe): `program --help`. test/native_shim/Arduino.h stands in for
; <Arduino.h>; src/app/TimeBase.h has a host clock the harness drives.
[env:native-replay]
platform = native
; The replay's --set goes through lib/ParamRegistry (step 11e item 9). Its
; manifest says frameworks "*" since CI run 108: with "arduino" the native
; platform (no framework) dropped it as incompatible before the include scan.
; Named here as well so the host build does not depend on the scan. The
; native-test-behavior suites include the library's .cpp directly as before;
; the archive built here stays unused there.
lib_deps = ParamRegistry
build_src_filter =
 +<host/>
 -<host/fieldsim/>
 +<audio/>
 +<detection/>
 -<detection/analyzer/>
build_flags =
 -std=gnu++17
 -O2
 -I test/native_shim
 -D BUILD_VERSION=\"0.4.0\"
 -D CHIRP_FREQUENCY_HZ=3200
 -D HOST_REPLAY=1

; native-fieldsim (BEH-008, step 16.2): N real ResonantBehaviors through a fake room with a hearing matrix
; (src/host/fieldsim/FieldSimMain.cpp). `pio run -e native-fieldsim`, then
; .pio/build/native-fieldsim/program.exe --matrix all|line|line2 --hours 4 --seed 1 [--offset 0|1] [--old].
[env:native-fieldsim]
platform = native
build_src_filter =
 +<host/fieldsim/>
 +<behavior/>
build_flags =
 -std=gnu++17
 -O2
 -I test/native_shim
 -D BUILD_VERSION=\"0.4.0\"
 -D HOST_REPLAY=1

; `pio test -e native-test`: test/test_replay_corpus replays the fixtures
; under test/fixtures through the same chain (ReplayMain.cpp's main() is
; compiled out under UNIT_TEST). A separate env so the test binary does not
; overwrite the replay program in .pio/build/native-replay/.
[env:native-test]
extends = env:native-replay
test_build_src = yes
test_filter = test_replay_corpus

; `pio test -e native-test-behavior`: the host unit suites. Each includes the
; src/ files it tests itself; no src build. test_shipped_profile,
; test_timebase and test_analyzer_pass_rules are also the on-device suites,
; run here too so host and board answer the same cases.
[env:native-test-behavior]
extends = env:native-replay
test_build_src = no
test_filter =
 test_behavior_refractory
 test_behavior_rest
 test_behavior_level
 test_behavior_base
 test_shipped_profile
 test_param_registry
 test_sound_output
 test_net_frame
 test_shape_inspector
 test_text_parse
 test_param_commands
 test_timebase
 test_analyzer_pass_rules
 test_ring_queue
 test_report_printers
 test_node_baseline
 test_node_composer
 test_behavior_status
 test_analyzer_commands

; The same replay with the Analyzer's diagnostics compiled in (step 11e item 7
; follow-up): -D ANALYZER_MODE selects the full DetectionDiagnostics inside
; src/detection, the only place the flag reaches in this build (detection/analyzer/
; and modes/ stay out). CI diffs `program --verbose --dir test/fixtures` of this
; build against native-replay's: the side channel must not change a verdict.
[env:native-replay-diag]
extends = env:native-replay
build_flags =
 ${env:native-replay.build_flags}
 -D ANALYZER_MODE

; `pio test -e native-test-diag`: test/test_detection_diagnostics checks that what
; DetectionDiagnostics records (pipeline events, the report capture, counters)
; describes what the runtime decided. Built from src with ANALYZER_MODE like
; native-replay-diag; a separate env so the test binary does not overwrite it.
[env:native-test-diag]
extends = env:native-replay-diag
test_build_src = yes
test_filter = test_detection_diagnostics
