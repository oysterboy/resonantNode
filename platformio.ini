; PlatformIO Project Configuration File

[platformio]
default_envs = esp32dev-analyzer

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

extra_scripts = pre:scripts/git_version.py

; Analyzer tooling is not part of the Node or Emitter runtime: keep it out of
; those binaries at the build level, not merely unreachable inside them. See
; docs/refactors/cleanup-analyzer-node-isolation.md. AnalyzerPassRules.h is
; header-only and stays available to the scalar detector in every build.
build_src_filter =
 +<*>
 -<detection/analyzer/>
 -<modes/analyzer/>

build_flags =
 -D BUILD_VERSION=\"0.4.0\"
 -D ARDUINO_LOOP_STACK_SIZE=16384
 -D CHIRP_FREQUENCY_HZ=3200

[env:esp32dev-emitter]
extends = env:esp32dev

build_flags =
 ${env:esp32dev.build_flags}
 -D EMITTER_MODE

[env:esp32dev-analyzer]
extends = env:esp32dev

; The Analyzer build is the one target that does compile the analyzer tooling.
build_src_filter =
 +<*>

build_flags =
 ${env:esp32dev.build_flags}
 -D ANALYZER_MODE
