[env:latency]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_src_filter = +<main.cpp> +<repo/hal/AudioSourceI2S.cpp> +<repo/hal/I2sToneOutput.cpp>

[env:latency-slot1]
extends = env:latency
build_flags = -D AUDIO_I2S_MIC_SLOT=1
